# The dispatcher's own defaults for the executor role (lowest priority; CLI options win).
# Project settings are options of the run-* wrapper; agent rules are role cards; verbs
# are the diag's.
access=read-write
rules=executor.md
prompt=executor.prompt
fix_prompt=executor-fix.prompt
retry_prompt=executor-retry.prompt
evidence_prompt=executor-evidence.prompt
max_turns=80
timeout=0
# A STATUS: SUCCESS with HEAD unchanged is not done.
require_commit=yes
# The blocking plan-conformance review (over the channel when the diag has
# 'verb <this node> <reviewer node> REVIEW', else in-process).
review.conformance.role=reviewer
