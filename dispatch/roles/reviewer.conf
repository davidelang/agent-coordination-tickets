# Built-in defaults for the reviewer role. Read-only, report-only.
access=read-only
rules=reviewer.md
prompt=reviewer.prompt
max_turns=40
timeout=0
# A blocking review sent over the channel (executor.review_node / review.NAME.node):
# the request verb and how long the executor waits for the reply.
verb=REVIEW
wait_timeout=3600
# Reply verbs when this role serves its own channel node (empty = no reply).
reply.pass=
reply.fail=
reply.error=
